<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <title>eMCP Browser</title>
    <style>
      body { font: 14px/1.4 sans-serif; margin: 0; width: 320px; color: #1c1917; }
      main { padding: 14px; }
      h1 { font-size: 16px; margin: 0 0 8px; }
      p { margin: 0 0 10px; }
      textarea { width: 100%; box-sizing: border-box; min-height: 72px; font: 12px/1.4 ui-monospace, monospace; }
      button { margin-top: 8px; margin-right: 6px; }
      video { width: 100%; margin-top: 8px; background: #000; }
      .online { color: #047857; font-weight: 700; }
      .offline { color: #b45309; font-weight: 700; }
      .error { color: #b91c1c; }
    </style>
  </head>
  <body>
    <main>
      <h1>eMCP Browser</h1>
      <p id="state" class="offline">Not paired</p>
      <label for="payload">Pairing payload</label>
      <textarea id="payload" placeholder="Paste the JSON from the eMCP auth page"></textarea>
      <div>
        <button id="scan" type="button">Scan QR</button>
        <button id="connect" type="button">Connect</button>
        <button id="disconnect" type="button">Disconnect</button>
      </div>
      <video id="camera" hidden autoplay playsinline></video>
      <p id="error" class="error"></p>
    </main>
    <script src="popup.js"></script>
  </body>
</html>
