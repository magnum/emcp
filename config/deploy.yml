# Name of your application. Used to uniquely configure containers.
service: emcp

# Name of the container image (use your-user/app-name on external registries).
image: emcp

# Deploy to these servers.
servers:
  web:
    - 192.168.0.92
  # job:
  #   hosts:
  #     - 192.168.0.1
  #   cmd: bin/jobs
  worker:
    hosts:
      - 192.168.0.92
    proxy: false
    options:
      health-cmd: "sh -c 'date'"
    cmd: bin/rails solid_queue:start
    env:
      clear:
        WEBHOOK_RETAIN: 604800
        SOLID_QUEUE_WORKER: true

# Traffico HTTPS termina su Cloudflare/cloudflared; kamal-proxy ascolta solo HTTP
# sulla porta host 8001 (cloudflared → 192.168.0.92:8001 → app).
#
# Con SSL terminato a monte, abilita config.assume_ssl in production.rb.
# Image boots db:prepare then a full Rails eager-load; Thruster is up before
# Puma binds, so kamal-proxy 502s until listen. 90s was still too tight.
deploy_timeout: 180
drain_timeout: 30

proxy:
  ssl: false
  host: emcp.m6i.it
  forward_headers: true
  healthcheck:
    path: /up
  run:
    http_port: 8001

# Where you keep your container images.
registry:
  # Alternatives: hub.docker.com / registry.digitalocean.com / ghcr.io / ...
  server: localhost:5555

  # Needed for authenticated registries.
  # username: your-user

  # Always use an access token rather than real password when possible.
  # password:
  #   - KAMAL_REGISTRY_PASSWORD

# Inject ENV variables into containers (secrets come from .kamal/secrets).
env:
  secret:
    - RAILS_MASTER_KEY
    - GOOGLE_CLIENT_ID
    - GOOGLE_CLIENT_SECRET
  clear:
    APP_HOST: https://emcp.m6i.it
    EMCP_PUBLIC_URL: https://emcp.m6i.it

    # Architecture A: Solid Queue runs only in emcp-worker. Must be the strings
    # 1/true/yes/on to enable — the literal "false" used to be truthy in Puma.
    SOLID_QUEUE_IN_PUMA: false
    RAILS_MAX_THREADS: 5

    # Set number of processes dedicated to Solid Queue (default: 1)
    # JOB_CONCURRENCY: 3

    # Set number of cores available to the application on each server (default: 1).
    # WEB_CONCURRENCY: 2

    # Log everything from Rails
    # RAILS_LOG_LEVEL: debug

# Aliases are triggered with "bin/kamal <alias>". You can overwrite arguments on invocation:
# "bin/kamal logs -r job" will tail logs from the first server in the job section.
aliases:
  console: app exec --interactive --reuse "bin/rails console"
  shell: app exec --interactive --reuse "bash"
  logs: app logs -f
  dbc: app exec --interactive --reuse "bin/rails dbconsole --include-password"

# Use a persistent storage volume for sqlite database files, Active Storage,
# MCP instance data (storage/mcp/instances), and optional app secrets
# (storage/.env). Type-level MCP defaults (timeouts, max_chars, allow_write)
# live in config/settings.yml. Per-instance tokens live in the encrypted
# credentials column and storage/mcp/instances/:id/server.yml.
volumes:
  - "/data/emcp/storage:/rails/storage"

# Bridge fingerprinted assets, like JS and CSS, between versions to avoid
# hitting 404 on in-flight requests. Combines all files from new and old
# version inside the asset_path.
asset_path: /rails/public/assets

# Footer tag/commit: the image has no .git (.dockerignore). Bake them at build.
<%
  git_commit = `git rev-parse --short HEAD`.to_s.strip
  git_tag = `git for-each-ref --sort=-v:refname --format=%(refname:short) refs/tags`
    .to_s.split("\n")
    .find { |name| name.match?(/\Av\d+\.\d+(?:\.\d+)?\z/) }
    .to_s
%>
builder:
  arch: amd64
  args:
    GIT_COMMIT: "<%= git_commit %>"
    GIT_TAG: "<%= git_tag %>"

  # # Build image via remote server (useful for faster amd64 builds on arm64 computers)
  # remote: ssh://docker@docker-builder-server
  #
  # # Pass arguments and secrets to the Docker build process
  # secrets:
  #   - GITHUB_TOKEN
  #   - RAILS_MASTER_KEY

# Use a different ssh user than root
ssh:
  user: magnum

# Use accessory services (secrets come from .kamal/secrets).
# accessories:
#   redis:
#     image: valkey/valkey:8
#     host: 192.168.0.2
#     port: 6379
#     volumes:
#       - data:/data
