production:
  refresh_service_tokens:
    class: EnsureServiceTokenRefreshJob
    queue: default
    schedule: every hour
  keep_whatsapp_bridge:
    class: WhatsappBridgeKeepaliveJob
    queue: default
    schedule: every minute
  purge_mcp_activity_logs:
    class: PurgeMcpActivityLogsJob
    queue: default
    schedule: every day at 12:20am
  clear_solid_queue_finished_jobs:
    command: "SolidQueue::Job.clear_finished_in_batches(sleep_between_batches: 0.3)"
    schedule: every hour at minute 12

development:
  refresh_service_tokens:
    class: EnsureServiceTokenRefreshJob
    queue: default
    schedule: every hour
  keep_whatsapp_bridge:
    class: WhatsappBridgeKeepaliveJob
    queue: default
    schedule: every minute
  purge_mcp_activity_logs:
    class: PurgeMcpActivityLogsJob
    queue: default
    schedule: every day at 12:20am
